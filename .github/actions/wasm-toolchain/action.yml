# Everything a job needs to build the frontend, so that the CI, Pages and
# Preview workflows set it up the same way: the toolchain with the wasm
# target, one cargo cache they all share, and Trunk. A workflow checks the
# repository out first, then `uses: ./.github/actions/wasm-toolchain`.
#
# Versions in more than one place: dtolnay/rust-toolchain and
# Swatinem/rust-cache are also used directly by the library and desktop
# jobs in ci.yml, which build natively and do not need Trunk, and
# actions/checkout is in every job of every workflow. Bump each of them
# everywhere at once.
name: Wasm toolchain
description: Rust with the wasm32 target, the shared cargo cache, and Trunk.
inputs:
  cache-key:
    description: >-
      Which cargo cache to use. The default is the one the CI, Pages and
      Preview workflows share; the app release names its own, since its
      builds add every desktop dependency and would crowd out the rest.
    default: wasm
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    # The key is what makes the cache one cache across the three workflows.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
    # Pinned: with "latest" the action asks the GitHub API for the newest
    # release unauthenticated, and when that is rate-limited it silently
    # installs v0.19.1, whose wasm-opt lacks bulk memory and which ignores
    # data-wasm-opt-params, so the build fails.
    - uses: jetli/trunk-action@v0.5.0
      with:
        version: v0.21.14
    # The wasm-bindgen and wasm-opt binaries Trunk runs. It fetches them
    # from GitHub releases the first time it needs them and keeps them
    # under its cache directory, which is wiped with the runner; so every
    # run was a download, and a download that failed (a connection reset
    # from GitHub's release storage, which happens) failed the build.
    # Cached, they are fetched once per platform and per version: the
    # wasm-bindgen version is in Cargo.lock, and the wasm-opt one is
    # Trunk's default for the version pinned above, so the key covers both
    # files. An older cache seeds a new key, and Trunk downloads only what
    # is missing. The directory is where the `directories` crate puts
    # `ProjectDirs::from("dev", "trunkrs", "trunk").cache_dir()` on each
    # platform.
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/trunk
          ~/Library/Caches/dev.trunkrs.trunk
          ~/AppData/Local/trunkrs/trunk/cache
        key: trunk-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock', '.github/actions/wasm-toolchain/action.yml') }}
        restore-keys: trunk-tools-${{ runner.os }}-
