name: Release the app

# Turns a tag into a GitHub release with an installer for every desktop
# platform: a .dmg for macOS (one build for Apple silicon and Intel), a
# setup .exe and an .msi for Windows, and a .deb, an .rpm and an
# .AppImage for Linux. Push a tag app-v<version>, where <version> is what
# app/src-tauri/Cargo.toml and app/Cargo.toml say, and the release
# appears as a draft, fills up as the builds finish, and is published
# when they all have; a failed build leaves the draft to look at, and
# rerunning the failed jobs completes it. A tag whose release is already
# published is refused, so a rerun never touches one. Run by hand
# instead, it builds everything as workflow artifacts and makes no
# release, for trying the pipeline out.
#
# The app's releases are separate from the library's: those come from
# leptos-rich-chat-v<version> tags, see publish-crate.yml.
#
# The macOS build is signed and notarized when the repository has the
# secrets for it (see .github/scripts/apple-credentials.sh for their
# names) and is an unsigned build otherwise, which the release notes say.
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write # the release and its assets

concurrency:
  group: release-app-${{ github.ref }}

jobs:
  open:
    name: Open the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      # The tag has to say what the manifests say, or nothing is built.
      # (The runner's own cargo serves: the script only reads metadata.)
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- --tag "$GITHUB_REF_NAME"; fi
          .github/scripts/release-version.sh app-v rich-chat-desktop rich-chat-app "$@"
      # Which mode the macOS build will be in, from the script that puts
      # it there, so that the notes and the build agree.
      - id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: .github/scripts/apple-credentials.sh
      # A draft, so that the release is not seen until every installer is
      # on it. Rerun for the same tag, the draft is picked up again; a
      # published release is left alone. (`gh release view` finds a draft
      # by its tag as well.)
      - id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNED: ${{ steps.apple.outputs.signed }}
          MACOS_NOTARIZED: ${{ steps.apple.outputs.notarized }}
        run: |
          version=${{ steps.version.outputs.version }}
          if release=$(gh release view "$GITHUB_REF_NAME" --json databaseId,isDraft 2>/dev/null); then
            if [ "$(jq -r .isDraft <<< "$release")" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already released; delete the release to make it again."
              exit 1
            fi
            id=$(jq -r .databaseId <<< "$release")
            echo "Draft release $id for $GITHUB_REF_NAME exists; its assets will be replaced."
          else
            .github/scripts/release-notes.sh "$version" > notes.md
            gh release create "$GITHUB_REF_NAME" --draft --title "Rich Chat $version" \
              --notes-file notes.md --generate-notes
            id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
            echo "Opened draft release $id for $GITHUB_REF_NAME."
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.name }}
    needs: open
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than one .dmg per chip, so there
          # is one macOS download and nobody has to know which Mac they have.
          - { name: macOS, os: macos-latest, target: universal-apple-darwin }
          # The oldest Ubuntu GitHub still runs: the .deb, .rpm and AppImage
          # link against its glibc and webkit, and run on anything newer.
          - { name: Linux, os: ubuntu-22.04, target: "" }
          - { name: Windows, os: windows-latest, target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasm-toolchain
        with:
          cache-key: release-app
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # The desktop shell's system libraries, as in ci.yml, plus what the
      # AppImage bundler uses. macOS and Windows ship their webviews.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      # tauri-action installs Tauri's CLI with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apple credentials, when set
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: .github/scripts/apple-credentials.sh
      # Runs `tauri build`, which runs Trunk for the frontend first (the
      # beforeBuildCommand in tauri.conf.json), then uploads the bundles
      # to the draft release, or only as workflow artifacts on a trial run.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.open.outputs.release }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

  publish:
    name: Publish the release
    needs: [open, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh release edit "$GITHUB_REF_NAME" --draft=false)
          echo "Released: $url" | tee -a "$GITHUB_STEP_SUMMARY"
