name: Release the app

# Puts an installer for every desktop platform on a GitHub release: a
# .dmg for macOS (one build for Apple silicon and Intel), a setup .exe and
# an .msi for Windows, and a .deb, an .rpm and an .AppImage for Linux.
# It runs when a release tagged app-v<version> is published, where
# <version> is the workspace's, which app/Cargo.toml and
# app/src-tauri/Cargo.toml take; the README's Releasing section says how
# to make the release. A tag that does not match fails the run before
# anything is built. The release is the one that was published: this
# puts the install instructions on top of its notes and the installers
# on it as the builds finish, some fifteen to twenty minutes later. A
# failed build leaves the release without its installers until the
# failed job is rerun. Run by hand instead, it builds everything as
# workflow artifacts and touches no release, for trying the pipeline out.
#
# The app's releases are separate from the library's: those are tagged
# leptos-rich-chat-v<version>, see publish-crate.yml.
#
# The macOS build is signed and notarized when the repository has the
# secrets for it (see .github/scripts/apple-credentials.sh for their
# names) and is an unsigned build otherwise, which the release notes say.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # the release's notes and assets

concurrency:
  group: release-app-${{ github.ref }}

jobs:
  check:
    name: Check the version
    # Releases of the library come here too, and are skipped.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'app-v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      # The tag has to say what the manifests say, or nothing is built.
      # (The runner's own cargo serves: the script only reads metadata.)
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then set -- --tag "$TAG"; fi
          .github/scripts/release-version.sh app-v rich-chat-desktop rich-chat-app "$@"
      # Which mode the macOS build will be in, from the script that puts
      # it there, so that the notes and the build agree.
      - id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: .github/scripts/apple-credentials.sh
      # The install table and the signing status go above the notes the
      # Generate release notes button wrote. A rerun finds them there.
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_SIGNED: ${{ steps.apple.outputs.signed }}
          MACOS_NOTARIZED: ${{ steps.apple.outputs.notarized }}
        run: |
          gh release view "$TAG" --json body --jq .body | .github/scripts/release-body.sh "$VERSION" > notes.md
          gh release edit "$TAG" --notes-file notes.md

  build:
    name: Build for ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than one .dmg per chip, so there
          # is one macOS download and nobody has to know which Mac they have.
          - { name: macOS, os: macos-latest, target: universal-apple-darwin }
          # The oldest Ubuntu GitHub still runs: the .deb, .rpm and AppImage
          # link against its glibc and webkit, and run on anything newer.
          - { name: Linux, os: ubuntu-22.04, target: "" }
          - { name: Windows, os: windows-latest, target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasm-toolchain
        with:
          cache-key: release-app
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # The desktop shell's system libraries, as in ci.yml, plus what the
      # AppImage bundler uses. macOS and Windows ship their webviews.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      # tauri-action installs Tauri's CLI with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apple credentials, when set
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: .github/scripts/apple-credentials.sh
      # Runs `tauri build`, which runs Trunk for the frontend first (the
      # beforeBuildCommand in tauri.conf.json), then uploads the bundles
      # to the release, or only as workflow artifacts on a trial run.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ github.event.release.id }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

