name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  library:
    name: Library (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versions in more than one place: this job, the coverage job, the
      # desktop job and publish-crate.yml set up the toolchain and cache
      # themselves, and the frontend jobs get them from
      # .github/actions/wasm-toolchain. Bump them all together.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p leptos-rich-chat -p rich-chat-app --all-targets -- -D warnings
      # Without `highlight`, as a host that turns it off builds the crate.
      - run: cargo clippy -p leptos-rich-chat --no-default-features --all-targets -- -D warnings
      # The runs are listed in the script, which the coverage job and
      # publish-crate.yml run too.
      - run: .github/scripts/library-tests.sh cargo test
      - run: cargo doc -p leptos-rich-chat --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  frontend:
    name: Frontend (wasm, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasm-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/e2e/package-lock.json
      - run: cargo check -p leptos-rich-chat --target wasm32-unknown-unknown
      - run: trunk build --release
        working-directory: app
      # The built app, driven in headless Chromium: preview, bubble, fonts,
      # highlighting, progressive rendering, and a clean console.
      - run: npm ci
        working-directory: app/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: app/e2e
      - run: npm test
        working-directory: app/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/e2e/screenshots

  # One leg per desktop platform, since the shell has code only one of them
  # compiles: the macOS dev app bundle, and the Windows
  # subsystem attribute.
  desktop:
    name: Desktop shell (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only Linux needs system packages: macOS and Windows ship their webviews.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo check -p rich-chat-desktop

  # The library's tests once more, instrumented, and the coverage sent to
  # Codecov: https://codecov.io/gh/wpm/Rich-Chat. A job of its own rather
  # than steps of the library job, since instrumented builds share nothing
  # with plain ones and would double that job. The runs are the library
  # job's, from the same script, so what counts as covered is what is
  # tested; the doctests are run but not counted, which needs a nightly
  # toolchain. The upload needs the repository secret CODECOV_TOKEN, the
  # upload token from the repository's page on Codecov, and fails the job
  # without it rather than letting the coverage quietly stop arriving;
  # except for a pull request from a fork, which cannot see the secret
  # and uploads without it as best it can, so that Codecov's rate limit
  # on such uploads cannot fail the fork's checks.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: .github/scripts/library-tests.sh cargo llvm-cov --no-report
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # One check for branch protection to require, so job names can change
  # without touching the ruleset. Green only when every job above is.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [library, frontend, desktop, coverage]
    if: always()
    steps:
      - run: |
          echo "library: ${{ needs.library.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "desktop: ${{ needs.desktop.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          test "${{ needs.library.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.desktop.result }}" = success
          test "${{ needs.coverage.result }}" = success
