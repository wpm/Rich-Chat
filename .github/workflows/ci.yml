name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  library:
    name: Library (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p leptos-rich-chat -p rich-chat-app --all-targets -- -D warnings
      - run: cargo test -p leptos-rich-chat
      - run: cargo test -p leptos-rich-chat --no-default-features
      # Together with the app, whose csr feature unifies into the library's
      # test build and turns reactive effects on.
      - run: cargo test -p leptos-rich-chat -p rich-chat-app
      - run: cargo doc -p leptos-rich-chat --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  frontend:
    name: Frontend (wasm, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Shared with the Pages and Preview workflows, which build the same thing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: jetli/trunk-action@v0.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/e2e/package-lock.json
      - run: cargo check -p leptos-rich-chat --target wasm32-unknown-unknown
      - run: trunk build --release
        working-directory: app
      # The built app, driven in headless Chromium: preview, bubble, fonts,
      # highlighting, progressive rendering, and a clean console.
      - run: npm ci
        working-directory: app/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: app/e2e
      - run: npm test
        working-directory: app/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/e2e/screenshots

  desktop:
    name: Desktop shell (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo check -p rich-chat-desktop

  # One check for branch protection to require, so job names can change
  # without touching the ruleset. Green only when every job above is.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [library, frontend, desktop]
    if: always()
    steps:
      - run: |
          echo "library: ${{ needs.library.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "desktop: ${{ needs.desktop.result }}"
          test "${{ needs.library.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.desktop.result }}" = success
