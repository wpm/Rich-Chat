name: Publish the crate

# Publishes leptos-rich-chat to crates.io when a release tagged
# v<version> is published on GitHub, where <version> is what
# leptos-rich-chat/Cargo.toml says: the crate is tested, its
# documentation built as docs.rs will build it, and published. Run by
# hand instead, it does everything but the publishing.
#
# If the tests or the version check fail, nothing is published and the
# release stands without a crate: fix the cause, then rerun the job, or
# delete the release and its tag and publish it again. A version that is
# on crates.io already is not published twice, so a rerun after the
# upload went through succeeds without doing anything.
#
# The 0.1.0 release, published by hand, is tagged leptos-rich-chat-v0.1.0;
# every release since is tagged v<version>.
#
# Publishing uses crates.io's trusted publishing, so no token is stored
# here: the job's OpenID Connect token is exchanged for a short-lived
# crates.io one. That is set up on the crate's settings page on
# crates.io (Trusted Publishing: GitHub, owner wpm, repository Rich-Chat,
# workflow publish-crate.yml). So this file keeps its name: renamed, it
# can no longer publish.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the token crates.io exchanges for a publishing one

concurrency:
  group: publish-crate

jobs:
  publish:
    name: Publish to crates.io
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tag has to say what the manifest says, or nothing is published.
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then set -- --tag "$TAG"; fi
          .github/scripts/release-version.sh v leptos-rich-chat "$@"
      # crates.io answers 200 for a version it has and 404 for one it has
      # not. One it has is not tested or published again.
      - id: published
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'Rich-Chat release workflow (github.com/wpm/Rich-Chat)' \
            "https://crates.io/api/v1/crates/leptos-rich-chat/$VERSION")
          case $status in
            200) echo "::notice::leptos-rich-chat $VERSION is on crates.io already; nothing to publish."
                 echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status for leptos-rich-chat $VERSION"; exit 1 ;;
          esac
      # The runs ci.yml makes, from the same script.
      - if: steps.published.outputs.publish != 'false'
        run: .github/scripts/library-tests.sh cargo test
      # As docs.rs builds it, all features on.
      - if: steps.published.outputs.publish != 'false'
        run: cargo doc -p leptos-rich-chat --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - if: github.event_name != 'release'
        run: cargo publish -p leptos-rich-chat --dry-run
      - id: auth
        if: steps.published.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.published.outputs.publish == 'true'
        run: cargo publish -p leptos-rich-chat
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
