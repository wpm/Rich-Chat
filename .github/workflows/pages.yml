name: Pages

# Publishes the chat as a website, so it can be used with nothing
# installed: https://wpm.github.io/Rich-Chat/
#
# The app built from main is uploaded as an artifact and deployed by
# GitHub Pages straight from this workflow; there is no site branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy the site
  id-token: write # prove the deployment comes from this workflow

# One deployment at a time, and the one in progress finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasm-toolchain
      # Where the site is served from, which Trunk needs for asset URLs.
      - id: pages
        uses: actions/configure-pages@v5
      - run: trunk build --release --public-url "${{ steps.pages.outputs.base_path }}/"
        working-directory: app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
