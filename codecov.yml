# Codecov's settings: https://codecov.io/gh/wpm/Rich-Chat, fed by the
# coverage and browser coverage jobs in .github/workflows/ci.yml. Reference:
# https://docs.codecov.com/docs/codecov-yaml

# Two uploads make a commit's coverage, the native tests' and the browser
# tests', and Codecov judges and comments on the first that arrives unless
# told to wait: so the checks and the comment wait for both. Another job
# that uploads raises the count.
codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    # The whole project may lose up to a point of coverage before the
    # check fails, so that a refactor which drops a few lines is not
    # blocked for it; a real loss still is.
    project:
      default:
        threshold: 1%
    # The changed lines of a pull request, held to the project's coverage.
    patch:
      default:
        target: auto

# One comment per pull request, kept short, and only when the change
# moves coverage.
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
  after_n_builds: 2

# Not run under the tests, so not counted: the desktop shell is only
# checked to compile, and the end-to-end tests drive the built app.
ignore:
  - "app/src-tauri/**"
  - "app/e2e/**"
  # The app's browser-only modules: the window, the controls bar, and
  # link opening. They run nowhere but in the browser, where the
  # end-to-end tests drive them without coverage counters, so on the
  # graph they would only be lines that no test can reach. The browser
  # coverage job in ci.yml counts browser-only code that has browser
  # tests (.github/scripts/browser-tests.sh); once these have some, take
  # them out of the list.
  - "app/src/main.rs"
  - "app/src/controls.rs"
  - "app/src/opener.rs"
