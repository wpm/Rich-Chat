[package]
name = "leptos-rich-chat"
version = "0.1.0"
description = "Leptos chat components that render Markdown, LaTeX math, and syntax-highlighted code"
readme = "README.md"
homepage = "https://wpm.github.io/Rich-Chat/"
keywords = ["leptos", "chat", "markdown", "latex", "syntax-highlighting"]
categories = ["gui", "wasm", "text-processing"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "assets/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["highlight", "bundled-fonts"]
# Syntax highlighting of fenced code blocks. Costs roughly a megabyte of
# grammar tables in the binary; without it code blocks render plain.
highlight = ["dep:syntect", "dep:two-face"]
# Embeds the Latin Modern math fonts (about 530 KB) so equations look the
# same on every platform. Without it, MathML falls back to whatever math
# font the system has.
bundled-fonts = []

[dependencies]
leptos.workspace = true
pulldown-cmark.workspace = true
pulldown-cmark-escape.workspace = true
pulldown-latex.workspace = true
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "ResizeObserver",
    "Window",
] }

[dev-dependencies]
# Tests render the components to HTML strings natively; the ssr feature is
# what makes `to_html` available and is unified into test builds only.
leptos = { workspace = true, features = ["ssr"] }
# The tests install an executor before rendering. Leptos's csr feature
# turns on reactive effects, and if another crate in the same build (the
# app) enables it, Cargo unifies it into this crate's test build too; an
# effect then spawns a task and panics without an executor to spawn on.
any_spawner = { version = "0.3", features = ["futures-executor"] }

[lints.rust]
unused_qualifications = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[[example]]
name = "highlight_css"
required-features = ["highlight"]
